services:
  mongodb:
    image: mongo:7
    container_name: sunspot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - sunspot_mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: sunspot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sunspot_redis_data:/data

volumes:
  sunspot_mongodb_data:
  sunspot_redis_data:
