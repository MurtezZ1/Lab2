name: AWS Infrastructure And Backend Deploy

on:
  pull_request:
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: ["main"]
    paths:
      - "infra/**"
      - "backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment"
        required: true
        default: "dev"
        type: choice
        options: ["dev", "prod"]
      apply:
        description: "Apply Terraform changes"
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_ENV: ${{ inputs.environment || 'dev' }}
  BACKEND_IMAGE_TAG: ${{ github.sha }}

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        run: terraform -chdir=infra/terraform/environments/${{ env.TF_ENV }} init

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/environments/${{ env.TF_ENV }} validate

      - name: Terraform plan
        run: |
          terraform -chdir=infra/terraform/environments/${{ env.TF_ENV }} plan \
            -var="bucket_name_prefix=${{ vars.TF_BUCKET_NAME_PREFIX }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="github_repo=${{ github.event.repository.name }}" \
            -var="backend_image_tag=${{ env.BACKEND_IMAGE_TAG }}" \
            -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply == true)
        run: terraform -chdir=infra/terraform/environments/${{ env.TF_ENV }} apply -auto-approve tfplan

  build-and-deploy-backend:
    name: Build Backend Image And Update ECS
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REPOSITORY_URL: ${{ vars.BACKEND_ECR_REPOSITORY_URL }}
        run: |
          docker build -f backend/Dockerfile -t "$ECR_REPOSITORY_URL:${BACKEND_IMAGE_TAG}" backend
          docker push "$ECR_REPOSITORY_URL:${BACKEND_IMAGE_TAG}"

      - name: Force ECS new deployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --force-new-deployment
